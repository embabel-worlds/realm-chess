name: chess
description: |
  A chessboard, a strong engine, and the plans behind its best moves.

  Play moves on the board and Stockfish 19 — compiled to WebAssembly, running
  in the appliance's own sandbox — returns its best lines. Each line is read
  for the plan it pursues: a kingside pawn storm, a minority attack, a central
  break, a quiet regrouping. Moves pursuing the same plan are grouped, so
  "g4, h4 or O-O-O" reads as one idea and "a3 then b4" as another, and an
  explanation contrasts them in plain words from facts a player can check.

  Because the engine is a realm verb behind a producer, the same analysis is a
  Virtual Cypher query — `MATCH (:Position {fen: $fen})-[:HAS_CANDIDATE]->(c)
  WHERE c.lossCp <= 50` — and a REST call, not only a page.

  No source system, no account, no key. The engine is GPL-3.0, and so is
  this realm.
version: 0.1.0

# The plan reader is a first cut: its rules name a pawn plan only when the first ten plies make
# it unmistakable, and misread plenty of real positions. Explanations are only as good as the
# world's configured model. The engine, the views and the query surface are sound.
maturity: experimental
url: https://github.com/embabel-worlds/realm-chess
author: Rod Johnson
host: docker
tags:
  - chess
  - games
  - engine
  - virtual-cypher
  - apps
  - skills
exports:
  - chess
  - Position
  - CandidateMove
  - PlanMeaning
  - BestMoves
  - PlansInPosition
  - ExplainPlans
  - PlanCatalogue
  - WhatPlanMeans
  # A realm with an exports list loads only the skills named in it; leave this out and the
  # skill is dropped at load with nothing but a debug line to say so.
  - chess-plans
