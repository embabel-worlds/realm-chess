name: chess
description: |
  A chessboard, a strong engine, and the plans a position calls for.

  Stockfish 19 — compiled to WebAssembly, running in the appliance's own
  sandbox — gives the best lines. The position's imbalances, in Jeremy
  Silman's sense, are computed from the board: material, the minor pieces,
  pawn structure, space, files, outposts, development, king safety. The
  Lichess opening book names it when it is a book position. A model with the
  chess-plans skill then decides the plans for both sides from those facts —
  the King's Indian Classical and Samisch, or the Exchange and closed Ruy
  Lopez, call for opposite plans, and the skill knows which.

  Everything is a Virtual Cypher hop from a pinned Position —
  HAS_IMBALANCES, IN_OPENING, HAS_CANDIDATE, HAS_PLAN — so the analysis is a
  query and a REST call, not only a page.

  No source system, no account, no key. The engine is GPL-3.0, and so is
  this realm.
version: 0.2.0

# Plans are a model's judgement with the chess-plans skill, and need an appliance whose
# gateway.ai.complete accepts `skills`. On an older one PlansInPosition fails; the engine, the
# imbalances and the opening book work anywhere.
maturity: experimental
url: https://github.com/embabel-worlds/realm-chess
author: Rod Johnson
host: docker
tags:
  - chess
  - games
  - engine
  - virtual-cypher
  - apps
  - skills
exports:
  - chess
  - Position
  - PositionImbalances
  - Opening
  - CandidateMove
  - Plan
  - BestMoves
  - ImbalancesOf
  - OpeningOf
  - PlansInPosition
  # A realm with an exports list loads only the skills named in it; leave this out and the
  # skill is dropped at load with nothing but a debug line to say so.
  - chess-plans
