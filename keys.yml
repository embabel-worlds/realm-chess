# The one key realm-chess can use: a Lichess personal API token, for the opening explorer's
# masters and player databases. Optional — the engine, imbalances, opening book and theory need
# no key at all.
- name: lichess
  displayName: Lichess
  description: Master games and a player's own games by position, from the Lichess opening explorer.
  getKeyUrl: https://lichess.org/account/oauth/token
  fields:
    - variable: LICHESS_TOKEN
      displayName: Personal API token (no scopes needed)
  validate:
    api: lichess
    operation: mastersExplorer
    args: { fen: "rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1", moves: 1, topGames: 0 }
