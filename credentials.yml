# The Lichess credential, as realm.ts declares it under `credentials:`, here too because the
# appliance binds a realm's credentials from this file and does not yet read realm.ts for them.
# Without it the token in the owner's wallet can never be bound, so the Lichess operations can
# never be approved and the masters, player and rated-moves views stay empty. Keep it equal to
# what `npm run synth` writes to .synth/credentials.yml; delete it once the host reads realm.ts.
- description: "A Lichess personal API token, no scopes needed: master games and a player's own games by position."
  docs: https://lichess.org/account/oauth/token
  id: lichess
  kind: bearer
  provider: Lichess
