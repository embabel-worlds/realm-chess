# The realm's plan vocabulary: what each plan the line reader can name MEANS, when it is the
# right idea, what it costs, and the rule that detects it. Seeded as PlanMeaning nodes so the
# explanation view, the app and a hand-written query all read the same definition — and so the
# definitions are a file a chess player can argue with rather than a string buried in a prompt.
#
# `detectedBy` must say what src/lib/plans.ts actually checks. Change one, change the other.

- type: PlanMeaning
  data:
    name: mating-attack
    title: Mating attack
    meaning: "The engine sees a forced mate. Every move in the line is forcing; there is no plan to weigh against it."
    when: "Always, when it is there."
    concedes: "Nothing — but only if every move is found. A mate line that is not seen to the end is often just a lost piece."
    detectedBy: "The engine reports mate for the side to move."
    order: 1
- type: PlanMeaning
  data:
    name: wins-material
    title: Wins material
    meaning: "The line comes out at least two points ahead once the exchanges settle — a piece for a pawn, the exchange, or better."
    when: "When the opponent has left something loose or overloaded."
    concedes: "Sometimes time or king safety: the engine's score already weighs that, so a material win with a modest score is being partly paid for."
    detectedBy: "Material (pawn 1, knight and bishop 3, rook 5, queen 9) after the line's exchanges settle is two or more points better than at the start."
    order: 2
- type: PlanMeaning
  data:
    name: passed-pawn
    title: Push the passed pawn
    meaning: "A pawn with no enemy pawn able to stop it advances. In an endgame this is usually the whole game; in a middlegame it ties the opponent's pieces to blockading it."
    when: "When the pawn is supported and the squares in front of it are not firmly blockaded."
    concedes: "A pawn pushed too far without support becomes a target."
    detectedBy: "One of the side to move's pawn moves lands on a square with no enemy pawn ahead of it on its own or either neighbouring file."
    order: 3
- type: PlanMeaning
  data:
    name: kingside-pawn-storm
    title: Kingside pawn storm
    meaning: "The f-, g- and h-pawns advance at the enemy king to pry open lines to it. Classically with the kings castled on opposite wings, where the pawns in front of your own king do not move."
    when: "Kings on opposite wings, the centre closed or stable, and more pieces able to join the attack than can defend."
    concedes: "The storming pawns can never come back. If the attack stalls, the squares behind them are weak — and with kings castled on the SAME side, it loosens your own king too."
    detectedBy: "Middlegame material; the enemy king ends the line on the kingside; the side to move plays two pawn moves on the f-h files, or one if the kings end on opposite wings."
    order: 4
- type: PlanMeaning
  data:
    name: queenside-pawn-storm
    title: Queenside pawn storm
    meaning: "The a-, b- and c-pawns advance at an enemy king castled queenside."
    when: "The mirror of the kingside storm: opposite-side castling with the opponent's king on the queenside."
    concedes: "As the kingside storm: the pawns cannot come back, and a stalled storm leaves holes."
    detectedBy: "Middlegame material; the enemy king ends the line on the queenside; two pawn moves on the a-c files, or one with the kings on opposite wings."
    order: 5
- type: PlanMeaning
  data:
    name: minority-attack
    title: Minority attack
    meaning: "Two queenside pawns (typically b4-b5) advance against three, not to break through but to exchange and leave the opponent with a weak, backward or isolated pawn — the classic plan in the Carlsbad structure of the Queen's Gambit Exchange."
    when: "When you have fewer queenside pawns than the opponent and their king is not there — a slow, positional plan."
    concedes: "Time. It is slow, and the opponent's counterplay is usually on the kingside or in the centre (a knight to e4, a kingside attack)."
    detectedBy: "Middlegame material; the side to move starts with fewer pawns on the a-c files than the opponent; it pushes its b-pawn; the enemy king is not on the queenside."
    order: 6
- type: PlanMeaning
  data:
    name: sacrifice-for-initiative
    title: Sacrifice for the initiative
    meaning: "Material is given up — two or more points once the exchanges settle — and the engine still rates the line as good. What comes back is time, open lines or a weakened king."
    when: "When the engine's score says the compensation is real. The score is the evidence; the material count alone would call it a blunder."
    concedes: "The material, permanently, if the initiative runs out."
    detectedBy: "Settled material is two or more points WORSE for the side to move, and the line is not a forced mate."
    order: 7
- type: PlanMeaning
  data:
    name: central-break
    title: Central break
    meaning: "A pawn on the c-, d-, e- or f-file strikes at an enemy pawn to open the centre on your own initiative."
    when: "When your pieces are better placed than the opponent's for an open position, or their king is still in the centre."
    concedes: "Tension. Once opened, the centre stays open, and a break made too early can leave an isolated or hanging pawn."
    detectedBy: "A pawn move by the side to move, landing on the c-f files, that captures an enemy pawn or attacks one — excluding a recapture of a pawn that arrived on the previous move, which answers the opponent's break."
    order: 8
- type: PlanMeaning
  data:
    name: central-control
    title: Prepare the centre
    meaning: "A pawn move that covers the square in front of your own central pawn, so that pawn can advance later: f3 behind e3 to prepare e4, c4 beside d4 to contest d5."
    when: "Before a central break, when making it immediately would fail."
    concedes: "A tempo, and sometimes a loosened king position (f3 especially)."
    detectedBy: "A non-capturing pawn move that attacks an empty square on the c-f files directly in front of one of the side to move's own pawns."
    order: 9
- type: PlanMeaning
  data:
    name: simplification
    title: Simplify
    meaning: "Exchanges — four or more captures in the first ten plies, or the queens coming off. Right when ahead, or when the opponent's activity depends on pieces that can be traded."
    when: "When you are better in the endgame than the middlegame: a better pawn structure, a better minor piece, material up."
    concedes: "Winning chances, if you are the one who needed pieces on the board to attack."
    detectedBy: "Four or more captures by either side in the first ten plies, or both queens gone."
    order: 10
- type: PlanMeaning
  data:
    name: kingside-expansion
    title: Gain space on the kingside
    meaning: "Kingside pawns advance without an enemy king to aim at — space, a clamp on squares, or preparing f4/f5 or g4/g5 levers."
    when: "When the kingside is where your pieces are and theirs are cramped."
    concedes: "The same holes a storm leaves, without the attack to justify them — and often your own king's cover."
    detectedBy: "Middlegame material; two pawn moves on the f-h files; not a storm (the enemy king is not on the kingside)."
    order: 11
- type: PlanMeaning
  data:
    name: queenside-expansion
    title: Gain space on the queenside
    meaning: "Queenside pawns advance without an enemy king there and without the pawn count that makes it a minority attack — usually a majority advancing to create a passed pawn."
    when: "With a queenside majority, or to cramp pieces the opponent has put there."
    concedes: "Squares behind the advancing pawns."
    detectedBy: "Middlegame material; two pawn moves on the a-c files; neither a storm nor a minority attack."
    order: 12
- type: PlanMeaning
  data:
    name: king-activity
    title: Activate the king
    meaning: "In an endgame the king is a strong piece: it walks towards the centre or the pawns."
    when: "When the queens are off and mating threats are gone."
    concedes: "Very little — unless the queens are still on, which is why this is only read in queenless positions."
    detectedBy: "The queens were off at the start and the side to move makes two or more king moves in the first ten plies."
    order: 13
- type: PlanMeaning
  data:
    name: king-safety
    title: King safety first
    meaning: "Castling now, or next move, before doing anything else: getting the king out of the centre and connecting the rooks."
    when: "When the centre may open, or when the opponent's pieces are pointing at your uncastled king."
    concedes: "It commits the king to one wing, which tells the opponent where to attack."
    detectedBy: "The side to move castles with its first or second move of the line."
    order: 14
- type: PlanMeaning
  data:
    name: prophylaxis
    title: Prophylaxis
    meaning: "A quiet move that stops the opponent's idea before it starts: a king step to b1 or h1 off a dangerous diagonal, or a3/h3 to take a square from an enemy piece."
    when: "When the opponent's best plan is clear and yours can wait a move."
    concedes: "A tempo, spent on not losing rather than on winning."
    detectedBy: "The first move is a quiet king move (not castling), or a single-square a- or h-pawn move that is not part of a storm — with queens on the board."
    order: 15
- type: PlanMeaning
  data:
    name: development
    title: Development
    meaning: "Knights and bishops come off the back rank. In the opening this is most of the plan."
    when: "In the opening, and whenever a minor piece is still at home."
    concedes: "Nothing, usually — the question is only which piece and to which square."
    detectedBy: "The first move develops a knight or bishop from the back rank, or the line develops two minor pieces."
    order: 16
- type: PlanMeaning
  data:
    name: piece-improvement
    title: Improve the pieces
    meaning: "Quiet piece moves — a rook to an open file, a knight rerouted to a better square. The position is not ready for a pawn plan, so the pieces go to where they will be needed."
    when: "When the pawn structure is set and neither side has a break ready."
    concedes: "Time, if the opponent does have a break ready. This tag is the reader saying 'no pawn plan here': the explanation should say WHICH piece is going WHERE, and why."
    detectedBy: "Two or more quiet moves by knights, bishops, rooks or queen in the first ten plies, and nothing more specific."
    order: 17
- type: PlanMeaning
  data:
    name: manoeuvring
    title: Manoeuvring
    meaning: "Nothing the line reader can name. The explanation has to come from reading the moves themselves."
    when: "Quiet, balanced positions."
    concedes: "Nothing in particular — which is what makes these positions hard."
    detectedBy: "No other rule matched."
    order: 18
