# Every producer is a verb in src/api/chess.ts, keyed by FEN. A FEN carries "/" and spaces,
# which `keyArgs` refuses, so `keyArg` hands the keys over as a plain list.
#
# Only the plan producers declare `pushdown:`, for the reader's level, which the verb really does
# take. Everything else — "within 50 centipawns" and the like — is decided over what comes back,
# graph-side; declaring a filter a source does not apply would make the engine count rows it
# never produced.
#
# Caches are long because positions do not change. For the engine and the plans the cache also
# keeps an explanation consistent with the numbers beside it: a search is not repeatable, and
# neither is a model's answer.

- name: candidateLines
  kind: remote
  operation: analysePosition
  keyArg: fens
  records: "$[*]"
  args:
    multiPv: 5
    depth: 18
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 604800 }

- name: positionImbalances
  kind: remote
  operation: positionImbalances
  keyArg: fens
  records: "$[*]"
  cache: { kind: ttl, seconds: 2592000, negativeTtlSeconds: 2592000 }

# A position the book does not name returns no row, and that absence is cached like a row.
- name: openingLookup
  kind: remote
  operation: openingLookup
  keyArg: fens
  records: "$[*]"
  cache: { kind: ttl, seconds: 2592000, negativeTtlSeconds: 2592000 }

- name: openingOfGameLine
  kind: remote
  operation: openingOfGameLine
  keyArg: lines
  records: "$[*]"
  cache: { kind: ttl, seconds: 2592000, negativeTtlSeconds: 2592000 }

# The wikibook changes slowly; a week is fresh enough, and a line with no page stays that way.
- name: theoryOfGameLine
  kind: remote
  operation: theoryOfGameLine
  keyArg: lines
  records: "$[*]"
  cache: { kind: ttl, seconds: 604800, negativeTtlSeconds: 604800 }

# One engine search and one model call per position; `role` picks the model tier the skill is
# applied with.
- name: positionPlans
  kind: remote
  operation: explainPlans
  keyArg: fens
  records: "$[*]"
  args:
    withinCp: 50
    multiPv: 5
    depth: 18
    role: best
    # The audience, from the query: `WHERE pl.level = 'beginner'` is pushed down into this slot.
    level: "{filters}"
  pushdown:
    # Verified live: the level changes what comes back, and each level is its own cache entry.
    - property: level
      op: EQUALS
      qualifier: "{value}"
      valuePattern: "^(beginner|intermediate|expert)$"
  cache: { kind: ttl, seconds: 604800 }

# The same, for the position a game line reaches: keyed by the line, so the model is told the
# line's opening name even after the position has left the book.
- name: linePlans
  kind: remote
  operation: explainLinePlans
  keyArg: lines
  records: "$[*]"
  args:
    withinCp: 50
    multiPv: 5
    depth: 18
    role: best
    # The audience, from the query: `WHERE pl.level = 'beginner'` is pushed down into this slot.
    level: "{filters}"
  pushdown:
    # Verified live: the level changes what comes back, and each level is its own cache entry.
    - property: level
      op: EQUALS
      qualifier: "{value}"
      valuePattern: "^(beginner|intermediate|expert)$"
  cache: { kind: ttl, seconds: 604800 }

# The Lichess explorer. No Lichess producer caches an EMPTY answer: a failed fetch (a 429 rate
# limit, say) reaches the cache as no rows, and a negative TTL would then serve "nothing here"
# for that long. An empty answer from Lichess is rare, so caching only real answers costs little.
#
# One request per position feeds both master hops — the same call, so its
# result is fetched once — and both player hops likewise. Master games change slowly; a player
# keeps playing, so their answers are kept for a day.
- name: masterMoves
  kind: remote
  operation: mastersAtPosition
  keyArg: fens
  records: "$.moves[*]"
  # One Lichess token, one request at a time: every Lichess producer shares this bucket, so a
  # page asking several questions at once queues them instead of drawing a 429.
  cost: { bucket: lichess, rate: "1/sec" }
  cache: { kind: ttl, seconds: 2592000 }

- name: masterGames
  kind: remote
  operation: mastersAtPosition
  keyArg: fens
  records: "$.games[*]"
  # One Lichess token, one request at a time: every Lichess producer shares this bucket, so a
  # page asking several questions at once queues them instead of drawing a 429.
  cost: { bucket: lichess, rate: "1/sec" }
  cache: { kind: ttl, seconds: 2592000 }

- name: playerMoves
  kind: remote
  operation: playerAtPosition
  keyArg: fens
  records: "$.moves[*]"
  args:
    # The player and colour, from the query: `WHERE m.player = … AND m.color = …`.
    filters: "{filters}"
  pushdown:
    - property: player
      op: EQUALS
      qualifier: "player={value}"
      valuePattern: "^([A-Za-z0-9_-]{2,30})$"
    - property: color
      op: EQUALS
      qualifier: "color={value}"
      valuePattern: "^(white|black)$"
  # One Lichess token, one request at a time: every Lichess producer shares this bucket, so a
  # page asking several questions at once queues them instead of drawing a 429.
  cost: { bucket: lichess, rate: "1/sec" }
  cache: { kind: ttl, seconds: 86400 }

- name: playerGames
  kind: remote
  operation: playerAtPosition
  keyArg: fens
  records: "$.games[*]"
  args:
    filters: "{filters}"
  pushdown:
    - property: player
      op: EQUALS
      qualifier: "player={value}"
      valuePattern: "^([A-Za-z0-9_-]{2,30})$"
    - property: color
      op: EQUALS
      qualifier: "color={value}"
      valuePattern: "^(white|black)$"
  # One Lichess token, one request at a time: every Lichess producer shares this bucket, so a
  # page asking several questions at once queues them instead of drawing a 429.
  cost: { bucket: lichess, rate: "1/sec" }
  cache: { kind: ttl, seconds: 86400 }

# Popularity by rating band and time control. The pinned dimension is pushed down; the other is
# fetched cell by cell (up to nine requests for a new position), so each combination is cached
# for a month.
- name: ratedMoves
  kind: remote
  operation: ratedMoves
  keyArg: fens
  records: "$[*]"
  args:
    filters: "{filters}"
  pushdown:
    - property: band
      op: EQUALS
      qualifier: "band={value}"
      valuePattern: "^(0|1000|1200|1400|1600|1800|2000|2200|2500)$"
    - property: speed
      op: EQUALS
      qualifier: "speed={value}"
      valuePattern: "^(ultraBullet|bullet|blitz|rapid|classical|correspondence|all)$"
  # One Lichess token, one request at a time: every Lichess producer shares this bucket, so a
  # page asking several questions at once queues them instead of drawing a 429.
  cost: { bucket: lichess, rate: "1/sec" }
  cache: { kind: ttl, seconds: 2592000 }
