openapi: 3.0.3
info:
  title: Lichess opening explorer — masters and player databases
  version: "1"
  description: >
    The two explorer databases realm-chess reads by position: master games (over-the-board,
    2200+), and one Lichess player's own games. Both need a Lichess personal API token.
servers:
  - url: https://explorer.lichess.ovh
paths:
  /masters:
    get:
      operationId: mastersExplorer
      summary: What masters played from a position, how each move scored, and the top games.
      parameters:
        - { name: fen, in: query, required: true, schema: { type: string } }
        - { name: moves, in: query, required: false, schema: { type: integer } }
        - { name: topGames, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Move statistics and top games.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /lichess:
    get:
      operationId: lichessExplorer
      summary: What Lichess players played from a position, filtered by rating band and time control, and how each move scored.
      parameters:
        - { name: fen, in: query, required: true, schema: { type: string } }
        - { name: ratings, in: query, required: false, schema: { type: string }, description: "Comma-separated band floors: 0,1000,1200,1400,1600,1800,2000,2200,2500" }
        - { name: speeds, in: query, required: false, schema: { type: string }, description: "Comma-separated: ultraBullet,bullet,blitz,rapid,classical,correspondence" }
        - { name: moves, in: query, required: false, schema: { type: integer } }
        - { name: topGames, in: query, required: false, schema: { type: integer } }
        - { name: recentGames, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Move statistics for the filtered games.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /player:
    get:
      operationId: playerExplorer
      summary: What one Lichess player played from a position, as one colour, and how it scored. Streams NDJSON; the last line is complete.
      parameters:
        - { name: player, in: query, required: true, schema: { type: string } }
        - { name: color, in: query, required: true, schema: { type: string, enum: [white, black] } }
        - { name: fen, in: query, required: true, schema: { type: string } }
        - { name: recentGames, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: Move statistics and recent games, as newline-delimited JSON updates.
          content:
            application/x-ndjson:
              schema: { type: string }
